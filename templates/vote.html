<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{{ event_title }} · Prediction</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="app-bg vote-body" data-mode="{{ mode }}">
  <main class="vote-wrap">
    <div class="eyebrow">{{ event_title|upper }} · PREDICTION</div>
    <section class="vote-card" id="voteCard" aria-labelledby="voteTitle">
      <div class="tiny-star" aria-hidden="true">✦</div>
      <h1 id="voteTitle">What's Your<br><span>Prediction?</span></h1>
      <p class="lead">A little guess, a lot of love.</p>
      <div class="choices">
        <button class="choice girl-choice" data-choice="girl" type="button">
          <span class="baby-illustration girl-baby" aria-hidden="true">
            <svg class="baby-art" viewBox="0 0 120 120" focusable="false">
              <path d="M37 48c-7 20-8 39-2 48l10-4 3-27zm46 0c7 20 8 39 2 48l-10-4-3-27z" fill="#49333a"/>
              <path d="M31 112c1-17 8-27 21-30h16c13 3 20 13 21 30z" fill="#a94e63" stroke="#702b3b" stroke-width="2"/>
              <path d="M39 99c12 7 30 7 42 0M51 83l9 12 9-12" fill="none" stroke="#e4bd70" stroke-linecap="round" stroke-width="3"/>
              <circle cx="60" cy="51" r="23" fill="#f3c9ae" stroke="#49333a" stroke-width="2"/>
              <path d="M37 49c0-20 12-29 24-29 13 0 22 10 22 26-7-2-12-8-15-14-6 7-17 12-31 13z" fill="#49333a"/>
              <path d="M39 43c11 1 22-4 30-12 3 7 8 12 14 14" fill="none" stroke="#d7ae5e" stroke-linecap="round" stroke-width="3"/>
              <path d="M43 40c-4 13-4 29-3 42m37-41c4 13 4 28 3 41" fill="none" stroke="#49333a" stroke-linecap="round" stroke-width="5"/>
              <circle cx="54" cy="53" r="2" fill="#49333a"/><circle cx="67" cy="53" r="2" fill="#49333a"/>
              <path d="M56 63q4 4 8 0" fill="none" stroke="#a94e63" stroke-linecap="round" stroke-width="2"/>
              <g fill="#fff5df" stroke="#d7ae5e" stroke-width="1">
                <circle cx="40" cy="72" r="4"/><circle cx="36" cy="72" r="2"/>
                <circle cx="80" cy="72" r="4"/><circle cx="84" cy="72" r="2"/>
              </g>
            </svg>
          </span>
          <span class="choice-title">Baby Girl</span><small>Team Girl</small>
        </button>
        <button class="choice boy-choice" data-choice="boy" type="button">
          <span class="baby-illustration boy-baby" aria-hidden="true">
            <svg class="baby-art" viewBox="0 0 120 120" focusable="false">
              <path d="M31 112c1-17 8-27 21-30h16c13 3 20 13 21 30z" fill="#71856a" stroke="#485d43" stroke-width="2"/>
              <path d="M51 83l9 12 9-12m-9 12v17" fill="none" stroke="#e4bd70" stroke-linecap="round" stroke-width="3"/>
              <circle cx="60" cy="52" r="23" fill="#f3c9ae" stroke="#49333a" stroke-width="2"/>
              <path d="M37 45c2-13 13-21 25-21s21 8 23 21H37z" fill="#84946e" stroke="#485d43" stroke-width="2"/>
              <path d="M40 43c11-4 29-4 40 0m-34-8c8-4 20-4 28 0" fill="none" stroke="#e4bd70" stroke-linecap="round" stroke-width="3"/>
              <path d="M41 49c1-7 5-12 10-15" fill="none" stroke="#49333a" stroke-linecap="round" stroke-width="4"/>
              <circle cx="54" cy="55" r="2" fill="#49333a"/><circle cx="67" cy="55" r="2" fill="#49333a"/>
              <path d="M56 64q4 4 8 0" fill="none" stroke="#a94e63" stroke-linecap="round" stroke-width="2"/>
              <path d="M53 30q7-8 14 0" fill="none" stroke="#f4e3b6" stroke-linecap="round" stroke-width="2"/>
            </svg>
          </span>
          <span class="choice-title">Baby Boy</span><small>Team Boy</small>
        </button>
      </div>
      <p class="status" id="voteStatus" role="status" aria-live="polite"></p>
    </section>
    <section class="vote-card thankyou-card hidden" id="thankyouCard" aria-labelledby="thanksTitle">
      <div class="success-mark" aria-hidden="true">✓</div>
      <h1 id="thanksTitle">Thank You!</h1>
      <p class="chosen" id="chosenText"></p>
      <p class="lead">Your prediction has been counted.</p>
      <button id="againButton" class="primary-button" type="button">Cast My Vote Again</button>
      <p class="status" id="thankyouStatus" role="status" aria-live="polite"></p>
    </section>
    <footer>Made with love for our growing family ♡</footer>
  </main>
  <script src="/static/js/vote.js" defer></script>
</body>
</html>
