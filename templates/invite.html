<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#641b2d">
  <meta name="description" content="{{ share_description }}">
  <link rel="canonical" href="{{ invite_url }}">
  <meta property="og:title" content="{{ share_title }}">
  <meta property="og:description" content="{{ share_description }}">
  <meta property="og:image" content="{{ cover_url }}">
  <meta property="og:image:secure_url" content="{{ cover_url }}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Baby shower invitation for Monica and Abhilash">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ invite_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ share_title }}">
  <meta name="twitter:description" content="{{ share_description }}">
  <meta name="twitter:image" content="{{ cover_url }}">
  <title>{{ event_title }} · Invitation</title>
  <link rel="stylesheet" href="/static/css/app.css?v=invite-card-5">
</head>
<body class="invite-body">
  <main class="invite-wrap">
    <article class="invite-content" aria-label="Baby shower invitation">
      <div class="invite-kolam-frame" aria-hidden="true">
        <span class="invite-kolam-edge invite-kolam-edge-top"></span>
        <span class="invite-kolam-edge invite-kolam-edge-right"></span>
        <span class="invite-kolam-edge invite-kolam-edge-bottom"></span>
        <span class="invite-kolam-edge invite-kolam-edge-left"></span>
        <img class="invite-kolam-corner invite-kolam-top-left" src="/static/images/kolam-corner.svg" alt="">
        <img class="invite-kolam-corner invite-kolam-top-right" src="/static/images/kolam-corner.svg" alt="">
        <img class="invite-kolam-corner invite-kolam-bottom-right" src="/static/images/kolam-corner.svg" alt="">
        <img class="invite-kolam-corner invite-kolam-bottom-left" src="/static/images/kolam-corner.svg" alt="">
      </div>
      <div class="invite-card">
        <img
          class="invite-image"
          src="/static/images/invitation-reference.png?v=3"
          alt="Baby shower invitation for Monica and Abhilash"
          width="768"
          height="1152"
        >
      </div>
      <nav class="invite-actions" aria-label="Invitation actions">
        <a class="invite-action invite-action-calendar" href="/invite/calendar.ics">
          <span class="invite-action-icon" aria-hidden="true">▦</span>
          Add to Calendar
        </a>
        <a class="invite-action invite-action-directions" href="{{ directions_url }}" target="_blank" rel="noopener">
          <span class="invite-action-icon" aria-hidden="true">⌖</span>
          Get Directions
        </a>
        <a class="invite-action invite-action-whatsapp" href="{{ whatsapp_url }}" target="_blank" rel="noopener">
          <span class="invite-action-icon" aria-hidden="true">↗</span>
          Share on WhatsApp
        </a>
      </nav>
    </article>
  </main>
</body>
</html>
